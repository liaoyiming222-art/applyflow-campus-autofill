<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ApplyFlow</title>
    <link rel="stylesheet" href="sidepanel.css" />
  </head>
  <body>
    <main>
      <section id="emptyState" class="state-card hidden">
        <div class="state-icon">◎</div>
        <h1>当前页面尚未开启</h1>
        <p>点击浏览器工具栏中的 ApplyFlow 图标，在招聘表单页面开启助手。</p>
      </section>

      <div id="assistantView">
        <section class="summary-card">
          <h1>当前页面</h1>
          <p id="pageStatus" class="status-line" aria-live="polite">正在识别表单…</p>
          <div class="metrics">
            <div><strong id="primaryMetricValue">…</strong><span id="primaryMetricLabel">正在识别</span></div>
            <div><strong id="secondaryMetricValue">…</strong><span id="secondaryMetricLabel">正在计算</span></div>
          </div>
          <section id="resultCard" class="result-card hidden" aria-live="polite"></section>
          <button id="fillButton" class="primary-button" disabled>智能填写字段</button>
          <p class="hint">只填写明确匹配的通用信息，不会提交申请。</p>
        </section>

        <section class="fields-section">
          <div class="section-heading">
            <h2>识别结果</h2>
            <button id="rescanButton" class="text-button">重新识别</button>
          </div>
          <div id="fieldList" class="field-list"></div>
        </section>
      </div>
    </main>

    <footer>
      <div class="footer-actions">
        <button id="profileButton">我的档案</button>
        <button id="closePanelButton" title="关闭侧边栏，恢复为悬浮球展示">关闭侧边栏</button>
      </div>
      <div id="totalSaved">累计节省约 0 分钟</div>
    </footer>

    <script src="../shared/schema.js"></script>
    <script src="sidepanel.js"></script>
  </body>
</html>
